<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 RPG – Teamfarben-Werkstatt</title>
<style>
  :root{
    --bg:#14161a; --panel:#1c1f25; --panel2:#23272f; --line:#2e333c;
    --text:#e6e8ec; --muted:#9aa2ae; --dim:#6b7280;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149; --info:#58a6ff;
    --idee:#6b7280; --vorschlag:#d29922; --bestaetigt:#3fb950;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  button,select,input,textarea{font:inherit;color:inherit}
  button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
         padding:5px 10px;cursor:pointer}
  button:hover{border-color:var(--dim)}
  button.on{background:var(--info);border-color:var(--info);color:#0b1220;font-weight:600}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);
         border-radius:6px;padding:5px 8px}
  a{color:var(--info)}
  .mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace}

  /* ---- Kopf ---- */
  header{position:sticky;top:0;z-index:20;background:var(--panel);
         border-bottom:1px solid var(--line)}
  .mode{padding:7px 14px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .mode.live{background:#0f2a17;color:#7ee787}
  .mode.snap{background:#2b2410;color:#e3b341}
  .mode.err {background:#2d1418;color:#ff9492}
  .mode small{font-weight:400;opacity:.8}
  .bar{display:flex;gap:8px;align-items:center;padding:8px 14px;flex-wrap:wrap}
  .grow{flex:1}
  .stats{display:flex;gap:14px;padding:0 14px 9px;flex-wrap:wrap;color:var(--muted);font-size:12px}
  .stats b{color:var(--text);font-size:14px}

  /* ---- Layout ---- */
  main{display:flex;align-items:flex-start;gap:0}
  /* --hh = gemessene Kopfhöhe (JS). #view braucht eine BEGRENZTE Höhe, sonst
     klebt die Jahresachse nicht: overflow-x macht #view zum Scrollcontainer,
     und sticky richtet sich am Container aus, nicht am Fenster. */
  #view{flex:1;min-width:0;padding:0 14px 60px;overflow:auto;
        height:calc(100vh - var(--hh,102px) - var(--tray,0px))}
  #side{width:340px;flex:none;border-left:1px solid var(--line);background:var(--panel);
        padding:12px 14px 40px;position:sticky;top:var(--hh,102px);
        max-height:calc(100vh - var(--hh,102px) - var(--tray,0px));overflow:auto}
  @media(max-width:900px){
    main{flex-direction:column}
    #view{height:auto;overflow-x:auto}
    #side{width:100%;position:static;max-height:none;border-left:0;border-top:1px solid var(--line)}
  }

  /* ---- Team-Zeitstrahl ---- */
  .trow{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .tname{width:150px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
         font-weight:600;font-size:13px;cursor:pointer}
  .tname:hover{text-decoration:underline}
  .tspan{display:flex;gap:1px}
  .cell{width:10px;height:22px;flex:none;cursor:pointer;position:relative;border-radius:1px}
  .cell:hover{outline:2px solid var(--info);outline-offset:0;z-index:2}
  .cell.sel{outline:2px solid #fff;z-index:3}
  .cell.gap{background:repeating-linear-gradient(45deg,#2a2f38 0 3px,#1c2027 3px 6px)}
  .cell.void{background:transparent}
  /* Platzhalter: die Farbe kommt roh aus SEASON_DATA, niemand hat sie geprueft.
     Schraffur liegt UEBER dem Ton, damit man beides sieht - welche Farbe das
     Spiel zeigt UND dass sie ungeprueft ist. */
  .cell.ph::after{content:'';position:absolute;inset:0;border-radius:1px;pointer-events:none;
    background:repeating-linear-gradient(45deg,rgba(0,0,0,.42) 0 2px,rgba(255,255,255,.16) 2px 4px)}
  .dot{position:absolute;right:1px;top:1px;width:5px;height:5px;border-radius:50%}
  .axis{display:flex;gap:1px;margin:0 0 6px;color:var(--dim);font-size:10px;
        position:sticky;top:0;z-index:6;background:var(--bg);padding:10px 0 3px}
  .axis span{width:10px;flex:none;text-align:center}
  .axis span.pad{width:157px}
  .axis span.dec{color:var(--muted);font-weight:600}

  /* ---- Jahr-Kacheln ---- */
  .yearref{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 10px;
           padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
  .yearref img{max-height:150px;border-radius:6px;display:block}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;
        cursor:pointer}
  .card:hover{border-color:var(--info)}
  .card.sel{border-color:#fff}
  .strip{height:30px}
  .cname{padding:7px 9px 0;font-weight:700;font-size:15px;letter-spacing:.2px;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cmeta{padding:6px 9px;display:flex;justify-content:space-between;align-items:center;
         font-size:11px;color:var(--muted)}
  .swatches{display:flex;gap:3px}
  .sw{width:13px;height:13px;border-radius:3px;border:1px solid #0006}

  /* ---- Badges ---- */
  .b{display:inline-block;padding:1px 6px;border-radius:10px;font-size:11px;
     border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .b.extra{color:#d2a8ff;border-color:#553d7a}
  .b.range{color:#7ee787;border-color:#2d5a35}
  .b.sd{color:#79c0ff;border-color:#1f4d78}
  .b.none{color:var(--dim)}
  .b.idee{color:var(--idee)}
  .b.vorschlag{color:var(--vorschlag);border-color:#5c4813}
  .b.bestaetigt{color:var(--bestaetigt);border-color:#2d5a35}
  .b.abweichend{color:var(--bad);border-color:#5c2626}
  .b.im-spiel{color:var(--ok);border-color:#2d5a35}
  .b.werkstatt{color:var(--muted)}

  /* ---- Seitenpanel ---- */
  #side h3{margin:0 0 2px;font-size:16px}
  #side .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
  .sect{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
  .sect h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;
           color:var(--muted);font-weight:600}
  .cand{border:1px solid var(--line);border-radius:7px;padding:8px;margin-bottom:8px;
        background:var(--panel2)}
  .cand.picked{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
  .cand .head{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
  .cand .acts{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
  .cand .acts button{padding:3px 8px;font-size:12px}
  .preview{display:flex;gap:6px;margin:6px 0}
  .pv{flex:1;border-radius:5px;padding:5px 7px;font-weight:700;font-size:13px;
      text-align:center;border:1px solid var(--line)}
  .pv.l{background:#f0f2f5}
  .pv.d{background:#111}
  .field{display:block;margin-bottom:7px}
  .field span{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
  .field input,.field textarea,.field select{width:100%}
  .hint{color:var(--muted);font-size:12px}

  /* ---- Offene Posten ---- */
  .find{border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin-bottom:7px;
        background:var(--panel);cursor:pointer}
  .find:hover{border-color:var(--info)}
  .find .t{font-weight:600}
  .find .d{color:var(--muted);font-size:12px}

  /* ---- Farbeditor ---- */
  .drop{border:2px dashed var(--line);border-radius:9px;padding:16px;text-align:center;
        color:var(--muted);display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
  .drop.over{border-color:var(--info);background:#58a6ff14;color:var(--text)}
  .linkish{color:var(--info);cursor:pointer;text-decoration:underline}
  .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .thumb{border:2px solid var(--line);border-radius:5px;cursor:pointer;background:#000}
  .thumb.on{border-color:var(--info)}
  .pkstage{display:flex;gap:12px;margin-top:12px;align-items:flex-start}
  #pkCanvas{max-width:100%;border-radius:7px;cursor:crosshair;display:block}
  .pkside{flex:none;width:120px}
  #pkLoupe{border:1px solid var(--line);border-radius:7px;background:#000;display:block;margin-bottom:6px}
  .picked-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .pk{display:inline-flex;gap:6px;align-items:center;padding:4px 6px;border-radius:6px;
      border:1px solid #0006;box-shadow:0 0 0 1px var(--line)}
  .pk b{background:#000c;color:#fff;padding:1px 5px;border-radius:4px;font-size:11px}
  .pk button{padding:1px 5px;font-size:11px;background:#000a;border-color:#0000}
  .pkpreview{margin-top:6px}
  .libthumb{width:78px;height:52px;object-fit:cover;border:2px solid var(--line);
            border-radius:5px;cursor:pointer;background:#000}
  .libthumb:hover{border-color:var(--info)}
  .libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .libcard{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel2)}
  .libcard img{width:100%;height:150px;object-fit:cover;display:block;background:#000}
  .libmeta{padding:7px 8px;display:flex;flex-direction:column;gap:5px}
  .libmeta input{width:100%;font-size:12px}
  .libacts{display:flex;gap:5px;align-items:center}
  .libacts button{padding:2px 7px;font-size:12px}

  /* ---- Bildleiste ---- */
  #tray{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);
        border-top:1px solid var(--line);padding:7px 12px 10px}
  .trayhead{display:flex;gap:10px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
  .trayhead button{padding:3px 9px;font-size:12px}
  .traystrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px;min-height:64px}
  .traythumb{position:relative;flex:none;cursor:pointer}
  .traythumb img{width:92px;height:60px;object-fit:cover;border:2px solid var(--line);
                 border-radius:6px;background:#000;display:block}
  .traythumb:hover img{border-color:var(--info)}
  .traythumb.dropok img{border-color:var(--ok);box-shadow:0 0 0 3px #3fb95044}
  .traythumb span{position:absolute;left:0;right:0;bottom:0;font-size:10px;
                  background:#000b;color:#fff;padding:1px 3px;border-radius:0 0 4px 4px;
                  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell[draggable],.card[draggable]{-webkit-user-drag:element}

  /* ---- Meldung ---- */
  #toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);z-index:60;
         background:var(--panel2);border:1px solid var(--ok);color:var(--text);
         padding:9px 16px;border-radius:8px;box-shadow:0 6px 24px #0008;
         opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  /* ---- Dialog ---- */
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);
         border-radius:10px;padding:0;max-width:96vw;width:min(760px,96vw);
         max-height:94vh;resize:both;overflow:hidden;display:none}
  dialog[open]{display:flex;flex-direction:column}
  dialog.wide{width:min(1180px,96vw);height:min(880px,92vh)}
  dialog::backdrop{background:#000a}
  .dlg-h{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;
         display:flex;justify-content:space-between;align-items:center}
  .dlg-b{padding:14px 16px;overflow:auto;flex:1;min-height:0}
  .dlg-f{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:10px;
         align-items:center;flex-wrap:wrap;flex:none;background:var(--panel)}
  .dlg-h{flex:none}
  textarea{width:100%;min-height:180px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
  .warn{color:var(--warn)} .bad{color:var(--bad)} .ok{color:var(--ok)}
  table.k{width:100%;border-collapse:collapse;font-size:12px}
  table.k td{padding:3px 6px;border-bottom:1px solid var(--line)}
  table.k td:first-child{color:var(--muted);white-space:nowrap}
</style>
</head>
<body>

<header>
  <div class="mode" id="mode">lädt …</div>
  <div class="bar">
    <button id="vTeam" class="on">nach Team</button>
    <button id="vYear">nach Jahr</button>
    <span id="yearWrap" style="display:none">
      <select id="year"></select>
    </span>
    <input id="q" placeholder="Team suchen …" style="width:170px">
    <label class="hint"><input type="checkbox" id="fIndy" checked> Indy ausblenden</label>
    <select id="filter">
      <option value="">alle Teams</option>
      <optgroup label="Befund">
        <option value="luecke">nur Lücken</option>
        <option value="einheitsfarbe">nur Einheitsfarbe</option>
        <option value="platzhalter">nur Platzhalter (Basisfarbe)</option>
        <option value="offen">alle offenen Posten</option>
        <option value="unentschieden">unentschieden</option>
        <option value="widerspruch">Widerspruch</option>
      </optgroup>
      <optgroup label="Fortschritt">
        <option value="stage:idee">nur Idee</option>
        <option value="stage:vorschlag">Vorschlag</option>
        <option value="stage:bestaetigt">bestätigt</option>
        <option value="werkstatt">alles mit Werkstatt-Daten</option>
      </optgroup>
      <optgroup label="Lieferstatus">
        <option value="del:im-spiel">im Spiel</option>
        <option value="del:abweichend">weicht vom Spiel ab</option>
        <option value="geplant">geplant, noch nicht im Spiel</option>
      </optgroup>
    </select>
    <span class="grow"></span>
    <button id="btnSave">Speichern</button>
    <button id="btnLib">Bilder</button>
    <button id="btnFind">Offene Posten</button>
    <button id="btnImport">Import</button>
    <button id="btnExport">Export</button>
  </div>
  <div class="stats" id="stats"></div>
</header>

<div id="tray" hidden>
  <div class="trayhead">
    <b>Bildersammlung</b>
    <span class="hint" id="trayHint">Team-Jahr auf ein Bild ziehen</span>
    <span class="grow"></span>
    <button id="trayManage">verwalten</button>
    <button id="trayClose">einklappen</button>
  </div>
  <div id="trayStrip" class="traystrip"></div>
</div>

<main>
  <div id="view"></div>
  <aside id="side"><div class="hint">Klick auf ein Team-Jahr, um es zu bearbeiten.</div></aside>
</main>

<dialog id="dlg">
  <div class="dlg-h"><span id="dlgTitle"></span><button onclick="dlg.close()">schließen</button></div>
  <div class="dlg-b" id="dlgBody"></div>
  <div class="dlg-f" id="dlgFoot"></div>
</dialog>

<!-- SNAPSHOT-INLINE -->
<script src="livery-core.js"></script>
<script>
'use strict';

/* ======================================================================
   Zustand
   ====================================================================== */
const S = {
  mode: 'lädt',          // live | snapshot | fehler
  meta: null,
  teams: {}, cells: {},  // Spielseite (Snapshot ODER live gelesen)
  findings: { luecke: [], einheitsfarbe: [], basisfarbe: [] },
  // deine Werkstatt: Kandidaten je Zelle + Referenzmaterial aus dem Sheet
  work: { cells: {}, imports: [], images: {}, teamNotes: {}, yearImages: {}, yearRefs: {} },
  ui: { view: 'team', year: 2025, sel: null, q: '', indy: true, filter: '' }
};
const WORK_KEY = 'f1rpg-livery-work-v1';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ======================================================================
   Laden: erst live versuchen, sonst Snapshot
   ====================================================================== */
async function boot() {
  loadWork();
  // Ist dieser Browser leer, aber im Projekt liegt ein gesicherter Arbeitsstand?
  // Dann ist DER die Wahrheit – so überlebt die Arbeit Browserwechsel, gelöschte
  // Website-Daten, einen anderen Port und jedes andere Gerät.
  if (!Object.keys(S.work.cells || {}).length) {
    try {
      const r = await fetch('quellen/livery-work.json', { cache: 'no-store' });
      if (r.ok) {
        const w = await r.json();
        if (w && w.cells && Object.keys(w.cells).length) {
          S.work = Object.assign({ cells: {}, imports: [], images: {}, teamNotes: {},
                                   yearImages: {}, yearRefs: {} }, w);
          S.work.loadedFromRepo = true;
        }
      }
    } catch (e) { /* keiner da – normaler erster Start */ }
  }
  try {
    await bootLive();
  } catch (liveErr) {
    try {
      await bootSnapshot(liveErr);
    } catch (snapErr) {
      S.mode = 'fehler';
      renderMode('Weder Live-Daten noch Snapshot lesbar: ' + snapErr.message);
      return;
    }
  }
  buildYearList();
  wire();
  render();
  addEventListener('resize', () => { measureHeader(); sizeTray(); });

  // Bild irgendwo auf die Seite ziehen oder einfuegen oeffnet den Farbeditor.
  addEventListener('dragover', e => { if (!dlg.open) e.preventDefault(); });
  addEventListener('drop', e => {
    if (dlg.open) return;
    const imgs = [...(e.dataTransfer.files || [])].filter(f => /^image\//.test(f.type));
    if (!imgs.length) return;
    e.preventDefault();
    openPicker(S.ui.sel, imgs);
  });
  addEventListener('paste', e => {
    if (dlg.open) return;
    const imgs = [...(e.clipboardData.files || [])].filter(f => /^image\//.test(f.type));
    if (imgs.length) openPicker(S.ui.sel, imgs);
  });
}

async function bootLive() {
  const grab = async f => {
    const r = await fetch('../' + f, { cache: 'no-store' });
    if (!r.ok) throw new Error(f + ' → HTTP ' + r.status);
    return r.text();
  };
  const [html, seasons, hist] = await Promise.all([
    grab('index.html'), grab('data/seasons.js'), grab('data/hist.js')
  ]);

  const SEASON_DATA = runFor(seasons, 'SEASON_DATA');
  const indy = runFor(hist, 'INDY_500_ONLY_CONSTRUCTORS') || [];
  const game = LiveryCore.extractGameColors(html)(SEASON_DATA);
  const built = LiveryCore.buildCells({ SEASON_DATA, game, indyConstructors: indy });

  S.teams = built.teams;
  S.cells = built.cells;
  S.findings = LiveryCore.gameFindings(built);
  S.meta = {
    gameVersion: game.version, colorHash: game.hash,
    yearFrom: built.years[0], yearTo: built.years[built.years.length - 1],
    rangesCount: game.TEAM_COLORS_RANGES.length
  };
  S.mode = 'live';

  // Snapshot danebenhalten – nur um zu sagen, ob er veraltet ist. Zwei Dinge
  // können hinterherhinken: die Farben des Spiels und die Werkstatt selbst
  // (dann ist die Unterwegs-Fassung eine alte Programmfassung).
  let staleColors = null, staleReport = false;
  try {
    const snap = await (await fetch('livery-snapshot.json', { cache: 'no-store' })).json();
    if (snap && snap.meta) {
      if (snap.meta.colorHash !== game.hash) staleColors = snap.meta.generated;
      if (snap.meta.reportHash) {
        const self = await (await fetch('livery-report.html', { cache: 'no-store' })).text();
        if (LiveryCore.fnv1a(self) !== snap.meta.reportHash) staleReport = true;
      }
    }
  } catch (e) { /* kein Snapshot da – im Live-Modus verschmerzbar */ }

  const warn = [];
  if (staleColors) warn.push('Snapshot vom ' + staleColors + ' hat andere Spielfarben');
  if (staleReport) warn.push('Unterwegs-Fassung ist eine ältere Programmfassung');

  renderMode('direkter Draht zum Monolith · Spiel v' + game.version +
    (warn.length ? ' · <span class="warn">' + warn.join(' · ') +
      ' → <span class="mono">node tools/build-livery-snapshot.js</span></span>' : ''));
}

async function bootSnapshot(whyLive) {
  let snap = window.LIVERY_SNAPSHOT;
  if (!snap) snap = await (await fetch('livery-snapshot.json', { cache: 'no-store' })).json();

  S.teams = {}; S.cells = {};
  for (const id in snap.teams) {
    const t = snap.teams[id];
    S.teams[id] = { id, name: t.name, years: t.years, indy: !!t.indy };
  }
  for (const key in snap.cells) {
    const c = snap.cells[key];
    const [team, year] = key.split(':');
    S.cells[key] = { team, year: +year, name: snap.teams[team] ? snap.teams[team].name : team,
                     colors: c.c || [], source: c.s, indy: !!c.i };
  }
  // Aeltere Snapshots kennen `basisfarbe` nicht - fehlende Listen auffuellen,
  // sonst laeuft der Platzhalter-Filter auf undefined.
  S.findings = Object.assign({ luecke: [], einheitsfarbe: [], basisfarbe: [] }, snap.findings || {});
  S.meta = snap.meta;
  S.mode = 'snapshot';

  renderMode('Werkstatt-Modus · Snapshot vom ' + snap.meta.generated +
    ' (Spiel v' + snap.meta.gameVersion + ') · <small>Lieferstatus nicht prüfbar – ' +
    esc(whyLive ? whyLive.message : 'kein Zugriff auf den Projektordner') + '</small>');
}

/** data/*.js im Browser auswerten – const landet nicht auf window, daher Rückgabe. */
function runFor(src, name) {
  return new Function('window', src + '\n;return typeof ' + name + ' !== "undefined" ? ' + name + ' : null;')({});
}

function renderMode(html) {
  const el = $('#mode');
  el.className = 'mode ' + (S.mode === 'live' ? 'live' : S.mode === 'snapshot' ? 'snap' : 'err');
  el.innerHTML = (S.mode === 'live' ? '● LIVE' : S.mode === 'snapshot' ? '◐ WERKSTATT' : '✕ FEHLER') +
    ' <span style="font-weight:400">' + html + '</span>';
}

/* ======================================================================
   Werkstatt-Daten (localStorage)
   ====================================================================== */
function loadWork() {
  try {
    const raw = localStorage.getItem(WORK_KEY);
    if (raw) S.work = Object.assign({ cells: {}, imports: [], images: {}, teamNotes: {}, yearImages: {}, yearRefs: {} }, JSON.parse(raw));
  } catch (e) { /* leerer Start ist ein gültiger Zustand */ }
}
function saveWork() {
  S.work.rev = (S.work.rev || 0) + 1;
  try { localStorage.setItem(WORK_KEY, JSON.stringify(S.work)); }
  catch (e) { alert('Arbeitsstand konnte nicht gespeichert werden: ' + e.message + '\nExportiere ihn lieber als Datei.'); }
}
function cellWork(key) { return S.work.cells[key] || null; }
function ensureWork(key) {
  if (!S.work.cells[key]) S.work.cells[key] = { pick: null, candidates: [] };
  return S.work.cells[key];
}
let candSeq = Date.now() % 100000;
const newCandId = () => 'c' + (++candSeq).toString(36);

/* ======================================================================
   Zustände einer Zelle: Fortschritt (gesetzt) + Lieferstatus (berechnet)
   ====================================================================== */
const STAGE_RANK = { idee: 0, vorschlag: 1, bestaetigt: 2 };
const rank = c => STAGE_RANK[c && c.stage] || 0;

function picked(key) {
  const w = cellWork(key);
  if (!w || !w.pick) return null;
  return w.candidates.find(c => c.id === w.pick) || null;
}

/** Lieferstatus wird NIE gespeichert – immer aus dem Vergleich abgeleitet. */
function delivery(key) {
  const p = picked(key);
  const game = S.cells[key];
  if (!p || !p.colors || !p.colors.length) return null;
  if (S.mode !== 'live' && S.mode !== 'snapshot') return 'unbekannt';
  const inGame = (game && game.colors || []).join(',').toUpperCase();
  const mine = p.colors.join(',').toUpperCase();
  if (!inGame) return 'werkstatt';
  if (inGame === mine) return S.mode === 'live' ? 'im-spiel' : 'im-spiel*';
  return 'abweichend';
}

/** Chaos oder Ordnung – die Prüfregeln aus LIVERY_TOOL_PLAN.md §4. */
function verdict(key) {
  const w = cellWork(key);
  const game = S.cells[key];
  const cands = w ? w.candidates : [];

  if (cands.length) {
    const conf = cands.filter(c => c.stage === 'bestaetigt');
    if (conf.length > 1) return 'widerspruch';
    // Zwei gleichrangige Kandidaten mit verschiedenen Farben sind eine echte
    // Meinungsverschiedenheit – auch wenn schon einer vorausgewählt ist.
    const withColors = cands.filter(c => c.colors && c.colors.length);
    if (withColors.length > 1) {
      const top = Math.max.apply(null, withColors.map(rank));
      const distinct = new Set(withColors.filter(c => rank(c) === top).map(c => c.colors.join(',')));
      if (distinct.size > 1) return 'unentschieden';
    }
    if (!w.pick) return cands.length > 1 ? 'unentschieden' : (cands[0].stage === 'idee' ? 'nur-idee' : 'offen');
    const d = delivery(key);
    if (d === 'abweichend') return 'abweichend';
    const p = picked(key);
    if (p && p.stage !== 'bestaetigt') return 'offen';
    return 'geklaert';
  }
  if (game && game.source === 'none') return 'luecke';
  // Farbe da, aber ungeprueft: sie faellt aus SEASON_DATA durch, weil keine Range
  // greift. Sobald in der Werkstatt ein Kandidat haengt, greift der Zweig oben und
  // die Zelle ist kein Platzhalter mehr.
  if (game && game.source === 'sd') return 'platzhalter';
  return null;
}

const VERDICT_LABEL = {
  luecke: 'Lücke', unentschieden: 'unentschieden', widerspruch: 'Widerspruch',
  'nur-idee': 'nur Idee', offen: 'offen', abweichend: 'weicht vom Spiel ab', geklaert: 'geklärt',
  platzhalter: 'Platzhalter (Basisfarbe)'
};
const VERDICT_COLOR = {
  luecke: '#6b7280', unentschieden: '#d29922', widerspruch: '#f85149',
  'nur-idee': '#8b949e', offen: '#d29922', abweichend: '#f85149', geklaert: '#3fb950',
  platzhalter: '#a371f7'
};

const einheitsSet = () => new Set(S.findings.einheitsfarbe.map(f => f.team));

/* ======================================================================
   Darstellung der Farben – spiegelt getTeamHeaderGradient()
   ====================================================================== */
function gradient(colors) {
  if (!colors || !colors.length) return 'transparent';
  if (colors.length === 1) return colors[0];
  if (colors.length === 2) return `linear-gradient(135deg,${colors[0]} 50%,${colors[1]} 50%)`;
  return `linear-gradient(135deg,${colors[0]} 33.3%,${colors[1]} 33.3% 66.7%,${colors[2]} 66.7%)`;
}
function effective(key) {
  const p = picked(key);
  if (p && p.colors && p.colors.length) return { colors: p.colors, from: 'work' };
  const g = S.cells[key];
  return { colors: (g && g.colors) || [], from: 'game' };
}

/* ======================================================================
   Ansichten
   ====================================================================== */
/**
 * Trifft der Filter auf diese Zelle zu? Eine Stelle fuer beide Ansichten –
 * vorher wirkte der Filter nur im Team-Zeitstrahl, nicht im Jahr-Raster.
 */
function cellMatchesFilter(key) {
  const f = S.ui.filter;
  if (!f) return true;
  const w = cellWork(key);
  const v = verdict(key);

  if (f.startsWith('stage:')) {
    const want = f.slice(6);
    return !!w && w.candidates.some(c => c.stage === want);
  }
  if (f.startsWith('del:')) return delivery(key) === f.slice(4);
  if (f === 'geplant') {
    const p = picked(key);
    const d = delivery(key);
    return !!p && p.stage === 'bestaetigt' && d !== 'im-spiel' && d !== 'im-spiel*';
  }
  if (f === 'werkstatt') return !!w;
  if (f === 'offen') return !!v && v !== 'geklaert' && v !== 'platzhalter';
  if (f === 'einheitsfarbe') return einheitsSet().has(key.split(':')[0]);
  return v === f;
}

function visibleTeams() {
  const q = S.ui.q.trim().toLowerCase();
  const eins = einheitsSet();
  const gaps = new Set(S.findings.luecke.map(f => f.team));
  return Object.values(S.teams).filter(t => {
    if (S.ui.indy && t.indy) return false;
    if (q && t.name.toLowerCase().indexOf(q) < 0 && t.id.toLowerCase().indexOf(q) < 0) return false;
    if (!S.ui.filter) return true;
    if (S.ui.filter === 'einheitsfarbe') return eins.has(t.id);
    return t.years.some(y => cellMatchesFilter(t.id + ':' + y));
  }).sort((a, b) => a.name.localeCompare(b.name, 'de'));
}

function renderTeamView() {
  const y0 = S.meta.yearFrom, y1 = S.meta.yearTo;
  const teams = visibleTeams();
  const eins = einheitsSet();

  // Platzhalter statt margin-left: die Achse klebt oben und muss dabei auch die
  // Namensspalte abdecken, sonst scrollen die Teamnamen darunter durch.
  let axis = '<div class="axis"><span class="pad"></span>';
  for (let y = y0; y <= y1; y++) axis += `<span class="${y % 10 === 0 ? 'dec' : ''}">${y % 10 === 0 ? String(y).slice(2) : ''}</span>`;
  axis += '</div>';

  const rows = teams.map(t => {
    const has = new Set(t.years);
    let seg = '';
    for (let y = y0; y <= y1; y++) {
      const key = t.id + ':' + y;
      if (!has.has(y)) { seg += '<div class="cell void"></div>'; continue; }
      const eff = effective(key);
      const v = verdict(key);
      const cls = (eff.colors.length ? '' : ' gap') + (v === 'platzhalter' ? ' ph' : '');
      const sel = S.ui.sel === key ? ' sel' : '';
      const style = eff.colors.length ? `background:${gradient(eff.colors)}` : '';
      const dot = (v && v !== 'geklaert' && v !== 'luecke' && v !== 'platzhalter')
        ? `<i class="dot" style="background:${VERDICT_COLOR[v]}"></i>` : '';
      seg += `<div class="cell${cls}${sel}" style="${style}" data-key="${key}" draggable="true" title="${esc(t.name)} ${y}${v ? ' – ' + VERDICT_LABEL[v] : ''}">${dot}</div>`;
    }
    const flag = eins.has(t.id) ? ' <span class="b" style="color:#d29922;border-color:#5c4813">Einheitsfarbe</span>' : '';
    return `<div class="trow"><div class="tname" data-team="${t.id}" title="${esc(t.id)}">${esc(t.name)}${flag}</div><div class="tspan">${seg}</div></div>`;
  }).join('');

  $('#view').innerHTML = axis + (rows || '<div class="hint">Kein Team passt zum Filter.</div>');
}

function renderYearView() {
  const y = S.ui.year;
  const q = S.ui.q.trim().toLowerCase();
  const list = Object.values(S.teams).filter(t => {
    if (t.years.indexOf(y) < 0) return false;
    if (S.ui.indy && t.indy) return false;
    if (q && t.name.toLowerCase().indexOf(q) < 0) return false;
    return cellMatchesFilter(t.id + ':' + y);
  }).sort((a, b) => a.name.localeCompare(b.name, 'de'));

  const cards = list.map(t => {
    const key = t.id + ':' + y;
    const eff = effective(key);
    const v = verdict(key);
    // Banner und Name werden getrennt gezeigt – der Name über einem zweifarbigen
    // Gradient steht sonst zur Hälfte auf der falschen Farbe (Surtees weiß/rot),
    // und ein Rand darüber verschmiert die Schrift. Im Spiel ist es genauso
    // getrennt: Gradient ist der Header-Balken, die Schrift trägt colors[0].
    const main = eff.colors[0] || '#888888';
    const lum = LiveryCore.luminance(main);
    const shadow = (lum < 0.13 || lum > 0.65)
      ? `text-shadow:0 0 4px ${lum > 0.5 ? '#000' : '#fff'}` : '';
    const sw = eff.colors.map(c => `<i class="sw" style="background:${c}"></i>`).join('') ||
               '<span class="b none">keine Farbe</span>';
    const nameStyle = eff.colors.length
      ? `color:${main};${shadow}` : 'color:var(--dim)';
    return `<div class="card ${S.ui.sel === key ? 'sel' : ''}" data-key="${key}" draggable="true">
      <div class="strip" style="background:${gradient(eff.colors)}"></div>
      <div class="cname" style="${nameStyle}">${esc(t.name)}</div>
      <div class="cmeta"><span class="swatches">${sw}</span>
        <span>${v ? `<span class="b" style="color:${VERDICT_COLOR[v]}">${VERDICT_LABEL[v]}</span>` : `<span class="b ${(S.cells[key]||{}).source}">${(S.cells[key]||{}).source}</span>`}</span></div>
    </div>`;
  }).join('');

  const yImg = S.work.yearImages[y], yRef = S.work.yearRefs[y];
  const head = (yImg || yRef) ? `<div class="yearref">
      <b>Saison ${y}</b>
      ${yRef ? `<a href="${esc(yRef)}" target="_blank" rel="noopener">Quelle öffnen</a>` : ''}
      ${yImg ? `<a href="${esc(yImg)}" target="_blank" rel="noopener">Referenzbild</a>` : ''}
      ${yImg ? `<img src="${esc(yImg)}" alt="Liveries ${y}"
        onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'bad',textContent:'Bild nicht erreichbar (URL abgelaufen)'}))">` : ''}
    </div>` : '';
  $('#view').innerHTML = head + `<div class="grid">${cards || '<div class="hint">Keine Teams in diesem Jahr.</div>'}</div>`;
}

function renderStats() {
  const cells = Object.values(S.cells).filter(c => !(S.ui.indy && c.indy));
  const n = cells.length;
  const by = s => cells.filter(c => c.source === s).length;
  const banner = cells.filter(c => c.colors.length > 1).length;
  const unsaved = (S.work.rev || 0) - (S.work.savedRev || 0);
  let open = 0, work = 0;
  for (const key in S.cells) {
    if (S.ui.indy && S.cells[key].indy) continue;
    const v = verdict(key);
    if (v && v !== 'geklaert' && v !== 'platzhalter') open++;
    if (cellWork(key)) work++;
  }
  $('#stats').innerHTML = `
    <span><b>${n}</b> Team-Jahre</span>
    <span>Banner <b>${banner}</b> (${(banner / n * 100).toFixed(0)} %)</span>
    <span>RANGES <b>${by('range')}</b></span>
    <span>SEASON_DATA <b>${by('sd')}</b></span>
    <span>ohne Farbe <b>${by('none')}</b></span>
    <span>Einheitsfarbe <b>${S.findings.einheitsfarbe.length}</b> Teams</span>
    <span>Platzhalter <b>${(S.findings.basisfarbe || []).length}</b> Teams</span>
    <span>offene Posten <b class="${open ? 'warn' : 'ok'}">${open}</b></span>
    <span>Werkstatt <b>${work}</b></span>` +
    (work ? '' : ` <span class="warn">— noch nichts eingelesen, das Google-Calc-Material
      steckt hinter „Import"</span>`) +
    (unsaved > 0
      ? ` <span class="warn">— <b>${unsaved}</b> Änderungen nur in diesem Browser,
          noch nicht als Datei gesichert</span>`
      : (S.work.savedAt ? ` <span class="ok">— gesichert ${esc(S.work.savedAt)}</span>` : ''));
}

/** Kopfhöhe messen – sie ändert sich, sobald die Werkzeugleiste umbricht. */
function measureHeader() {
  const h = document.querySelector('header').offsetHeight;
  document.documentElement.style.setProperty('--hh', h + 'px');
}

function render() {
  renderStats();
  measureHeader();
  if (S.ui.view === 'team') renderTeamView(); else renderYearView();
  renderSide();
}

/* ======================================================================
   Seitenpanel: der Editor
   ====================================================================== */
function renderSide() {
  const key = S.ui.sel;
  if (!key) { $('#side').innerHTML = '<div class="hint">Klick auf ein Team-Jahr, um es zu bearbeiten.</div>'; return; }

  const [team, year] = key.split(':');
  const t = S.teams[team] || { name: team };
  const game = S.cells[key];
  const w = cellWork(key);
  const v = verdict(key);
  const d = delivery(key);

  const gameLine = game && game.colors.length
    ? `<span class="swatches">${game.colors.map(c => `<i class="sw" style="background:${c}"></i>`).join('')}</span>
       <span class="b ${game.source}">${game.source}</span> <span class="mono" style="font-size:11px">${game.colors.join(' ')}</span>`
    : '<span class="b none">grau / keine Farbe</span>';

  const cands = (w ? w.candidates : []).map(c => renderCand(key, c, w.pick === c.id)).join('') ||
    '<div class="hint">Noch kein Vorschlag. Unten anlegen.</div>';

  $('#side').innerHTML = `
    <h3>${esc(t.name)} ${year}</h3>
    <div class="sub mono">${esc(team)}:${year}
      ${v ? ` · <span class="b" style="color:${VERDICT_COLOR[v]}">${VERDICT_LABEL[v]}</span>` : ''}
      ${d ? ` · <span class="b ${d.replace('*','')}">${d}</span>` : ''}</div>

    <div class="sect"><h4>Im Spiel</h4><div>${gameLine}</div>
      ${S.mode !== 'live' ? '<div class="hint" style="margin-top:5px">Werkstatt-Modus: Stand vom Snapshot, kann veraltet sein.</div>' : ''}
    </div>

    <div class="sect"><h4>Kandidaten</h4>${cands}</div>

    <div class="sect"><h4>Neuer Kandidat</h4>
      <label class="field"><span>Farbe – Hex oder Wort, „blau-blau-weiß" = ⅔ + ⅓</span>
        <input id="nc" placeholder="z. B. #FF6600-#FF6600-weiß"></label>
      <label class="field"><span>Notiz / Quelle</span><input id="nn" placeholder="optional"></label>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button data-pick="1" title="Bild reinziehen und Farbe abnehmen">Farbe aus Bild</button>
        <button data-add="idee">als Idee</button>
        <button data-add="vorschlag">als Vorschlag</button>
        <button data-add="note">als Auftrag (ohne Farbe)</button>
      </div>
      <div style="margin-top:8px"><button data-span="1">… für eine Zeitspanne übernehmen</button></div>
    </div>

    ${S.work.teamNotes[team] ? `<div class="sect"><h4>Notiz aus dem Sheet</h4>
      <div class="hint">${esc(S.work.teamNotes[team])}</div></div>` : ''}

    <div class="sect"><h4>Referenzbild</h4>
      <label class="field"><input id="img" placeholder="Bild-URL für ${esc(t.name)}"
        value="${esc(S.work.images[team] || '')}"></label>
      ${S.work.images[team] ? `<a href="${esc(S.work.images[team])}" target="_blank" rel="noopener">öffnen</a>
        <div style="margin-top:6px"><img src="${esc(S.work.images[team])}" style="max-width:100%;border-radius:6px"
        onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'bad',textContent:'Bild nicht erreichbar – URL vermutlich abgelaufen'}))"></div>` : ''}
    </div>`;

  $('#side').querySelectorAll('[data-add]').forEach(b =>
    b.onclick = () => addCandidate(key, b.dataset.add));
  const span = $('#side').querySelector('[data-span]');
  if (span) span.onclick = () => addSpan(key);
  const pick = $('#side').querySelector('[data-pick]');
  if (pick) pick.onclick = () => openPicker(key);
  const img = $('#img');
  if (img) img.onchange = () => { S.work.images[team] = img.value.trim(); saveWork(); renderSide(); };
}

function renderCand(key, c, isPick) {
  const lum = c.colors && c.colors.length ? LiveryCore.luminance(c.colors[0]) : 0.5;
  const shadow = (lum < 0.13 || lum > 0.65) ? `text-shadow:0 0 3px ${lum > 0.5 ? '#000' : '#fff'}` : '';
  const preview = c.colors && c.colors.length ? `
    <div class="preview">
      <div class="pv l" style="color:${c.colors[0]};${shadow}">Name hell</div>
      <div class="pv d" style="color:${c.colors[0]};${shadow}">Name dunkel</div>
    </div>
    <div style="height:18px;border-radius:4px;background:${gradient(c.colors)}"></div>
    <div class="mono hint" style="margin-top:4px">${c.colors.join(' ')} · Luminanz ${lum.toFixed(2)}${(lum < 0.13 || lum > 0.65) ? ' → Shadow im Spiel' : ''}</div>`
    : `<div class="hint">${c.kind === 'note' ? 'Auftrag ohne Farbwert' : 'unaufgelöst'}: <i>${esc(c.raw || c.note)}</i></div>`;

  return `<div class="cand ${isPick ? 'picked' : ''}">
    <div class="head">
      <span class="b ${c.stage}">${c.stage}</span>
      ${c.kind === 'note' ? '<span class="b">Auftrag</span>' : ''}
      ${isPick ? '<span class="b bestaetigt">gewählt</span>' : ''}
      <span class="grow"></span>
      <span class="hint" style="font-size:11px">${esc((c.origin && c.origin.kind) || 'hand')}</span>
    </div>
    ${preview}
    ${c.note ? `<div class="hint" style="margin-top:5px">${esc(c.note)}</div>` : ''}
    <div class="acts">
      ${!isPick && c.colors ? `<button data-pick="${c.id}">wählen</button>` : ''}
      ${c.stage !== 'bestaetigt' && c.colors ? `<button data-stage="${c.id}">bestätigen</button>` : ''}
      ${c.stage === 'bestaetigt' ? `<button data-unstage="${c.id}">zurückstufen</button>` : ''}
      <button data-del="${c.id}">löschen</button>
    </div></div>`;
}

function addCandidate(key, mode) {
  const raw = $('#nc').value.trim();
  const note = $('#nn').value.trim();
  if (mode === 'note') {
    if (!raw && !note) return alert('Auftrag braucht wenigstens einen Text.');
    pushCand(key, { kind: 'note', colors: null, raw: raw || note, stage: 'idee', note });
    return finish(key);
  }
  const parsed = LiveryCore.parseColorInput(raw);
  if (!parsed.colors) {
    return alert('Farbe nicht verstanden: ' + (parsed.unresolved.join(', ') || raw) +
      '\n\nErlaubt sind Hex (#FF6600) und bekannte Farbworte. Unbekanntes wird bewusst nicht geraten.');
  }
  pushCand(key, { kind: 'colors', colors: parsed.colors, raw: parsed.raw, stage: mode, note });
  finish(key);
}

function pushCand(key, data) {
  const w = ensureWork(key);
  const c = Object.assign({ id: newCandId(), origin: { kind: 'hand', date: new Date().toISOString().slice(0, 10) } }, data);
  w.candidates.push(c);
  // Der höherrangige Kandidat gewinnt die Vorauswahl: eine jahresgenaue Angabe
  // darf nicht von einer pauschalen Idee ohne Jahr verdrängt werden (Surtees
  // stand im Sheet flach als „weiß", in der Aufschlüsselung jahresweise anders).
  if (c.colors) {
    const cur = w.pick && w.candidates.find(x => x.id === w.pick);
    if (!cur || rank(c) > rank(cur)) w.pick = c.id;
  }
  return c;
}

function addSpan(key) {
  const [team] = key.split(':');
  const t = S.teams[team];
  const raw = $('#nc').value.trim();
  const parsed = LiveryCore.parseColorInput(raw);
  if (!parsed.colors) return alert('Erst eine gültige Farbe eintragen.');
  const from = +prompt('Von Jahr:', t.years[0]);
  const to = +prompt('Bis Jahr:', t.years[t.years.length - 1]);
  if (!from || !to || to < from) return;
  const note = $('#nn').value.trim();
  const spanId = 's' + newCandId();
  let n = 0;
  for (const y of t.years) {
    if (y < from || y > to) continue;
    pushCand(team + ':' + y, { kind: 'colors', colors: parsed.colors, raw: parsed.raw, stage: 'vorschlag', note, spanId });
    n++;
  }
  alert(n + ' Saisons gesetzt (' + from + '–' + to + ').');
  finish(key);
}

function finish(key) { saveWork(); render(); }

/* ======================================================================
   Offene Posten
   ====================================================================== */
function showFindings() {
  const groups = {};
  for (const key in S.cells) {
    if (S.ui.indy && S.cells[key].indy) continue;
    const v = verdict(key);
    if (!v || v === 'geklaert') continue;
    (groups[v] = groups[v] || []).push(key);
  }
  const order = ['widerspruch', 'abweichend', 'unentschieden', 'offen', 'nur-idee', 'luecke', 'platzhalter'];
  let html = '';

  for (const v of order) {
    const keys = groups[v]; if (!keys) continue;
    const byTeam = {};
    keys.forEach(k => { const [t] = k.split(':'); (byTeam[t] = byTeam[t] || []).push(+k.split(':')[1]); });
    html += `<h4 style="margin:14px 0 7px;color:${VERDICT_COLOR[v]}">${VERDICT_LABEL[v]} · ${keys.length} Team-Jahre</h4>`;
    html += Object.keys(byTeam).sort((a, b) => byTeam[b].length - byTeam[a].length).slice(0, 40).map(t => {
      const ys = byTeam[t].sort((a, b) => a - b);
      return `<div class="find" data-jump="${t}:${ys[0]}"><div class="t">${esc((S.teams[t] || {}).name || t)}</div>
        <div class="d">${ys.length} Saisons · ${compressYears(ys)}</div></div>`;
    }).join('');
  }

  if (S.findings.einheitsfarbe.length) {
    html += `<h4 style="margin:18px 0 7px;color:#d29922">Einheitsfarbe · ${S.findings.einheitsfarbe.length} Teams</h4>
      <div class="hint" style="margin-bottom:8px">Diese Teams tragen über ihre ganze Historie genau einen Wert
      aus SEASON_DATA. Keine Lücke, sondern fehlende Ära-Struktur.</div>`;
    html += S.findings.einheitsfarbe.map(f =>
      `<div class="find" data-jump="${f.team}:${f.from}"><div class="t">${esc(f.name)}
        <i class="sw" style="background:${f.value[0]};display:inline-block;vertical-align:-2px"></i></div>
        <div class="d">${f.seasons} Saisons durchgehend ${esc(f.value.join(' '))} · ${f.from}–${f.to}</div></div>`).join('');
  }

  openDialog('Offene Posten', html || '<div class="ok">Nichts offen.</div>', []);
  $('#dlgBody').querySelectorAll('[data-jump]').forEach(el => el.onclick = () => {
    const key = el.dataset.jump;
    S.ui.sel = key; S.ui.year = +key.split(':')[1];
    dlg.close(); render();
    const node = $(`[data-key="${key}"]`); if (node) node.scrollIntoView({ block: 'center', behavior: 'smooth' });
  });
}

function compressYears(ys) {
  const out = []; let a = ys[0], b = ys[0];
  for (let i = 1; i <= ys.length; i++) {
    if (ys[i] === b + 1) { b = ys[i]; continue; }
    out.push(a === b ? String(a) : a + '–' + b); a = b = ys[i];
  }
  return out.join(', ');
}

function doImport() {
  let doc;
  try { doc = JSON.parse($('#impText').value); }
  catch (e) { return alert('Kein gültiges JSON: ' + e.message); }

  const trusted = $('#impTrust').checked;
  const built = { teams: S.teams, cells: S.cells };
  const res = LiveryCore.normalizeImport(doc, built, trusted);
  if (!res.entries.length) {
    return alert('Nichts übernommen.\n' + res.skipped.map(s => '· ' + s.why).join('\n'));
  }

  const stamp = new Date().toISOString().slice(0, 10);

  // Kontext: Referenzbilder und Chat-/Doc-Links je Saison und Team. Die tragen
  // im Sheet die halbe Arbeitsgrundlage – ohne sie wäre der Import halbiert.
  let ctxYears = 0, ctxTeams = 0;
  if (res.context) {
    for (const y in (res.context.years || {})) {
      const c = res.context.years[y];
      if (c.image) { S.work.yearImages[y] = c.image; }
      if (c.ref) { S.work.yearRefs[y] = c.ref; }
      ctxYears++;
    }
    for (const t in (res.context.teams || {})) {
      const c = res.context.teams[t];
      if (c.image && !S.work.images[t]) S.work.images[t] = c.image;
      if (c.note) S.work.teamNotes[t] = c.note;
      ctxTeams++;
    }
  }

  let n = 0, conflicts = 0;
  for (const e of res.entries) {
    const w = ensureWork(e.key);
    const same = w.candidates.find(c => (c.colors || []).join(',') === (e.colors || []).join(',') && c.kind === e.kind);
    if (same) continue;
    const c = pushCand(e.key, {
      kind: e.kind, colors: e.colors, raw: e.raw, stage: e.stage, note: e.note,
      spanId: e.spanFrom + '-' + e.spanTo,
      origin: { kind: (res.source.kind || 'chat'), ref: res.source.ref || '', image: res.source.image || '', date: stamp }
    });
    if (w.candidates.filter(x => x.stage === 'bestaetigt').length > 1) conflicts++;
    n++;
  }
  S.work.imports.push({ date: stamp, ref: res.source.ref || '', note: res.source.note || '', count: n, trusted });
  saveWork(); dlg.close(); render();

  alert(`${n} Kandidaten übernommen${trusted ? ' (als bestätigt)' : ''}.` +
    (ctxYears || ctxTeams ? `
${ctxYears} Saisons und ${ctxTeams} Teams mit Referenzbild/Link.` : '') +
    (conflicts ? `\n${conflicts} Zellen haben jetzt mehrere bestätigte Werte – stehen als Widerspruch in den offenen Posten.` : '') +
    (res.skipped.length ? `\n\nÜbersprungen:\n` + res.skipped.slice(0, 12).map(s => '· ' + s.why).join('\n') : ''));
}

/* ======================================================================
   Speichern ohne Umweg über den Download-Ordner

   Drei Wege, in dieser Reihenfolge:
   1. Datei-Handle (Chrome/Edge): einmal die Datei wählen, danach ein Klick.
      Der Handle überlebt in IndexedDB.
   2. Speicher-Dienst: node tools/livery-server.js – geht in jedem Browser.
   3. Download – der alte Weg, wenn beides fehlt.
   ====================================================================== */
const SAVE = { port: 3011, handle: undefined };

async function handleStore(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction('images', mode);
    const out = fn(tx.objectStore('images'));
    tx.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
    tx.onerror = () => rej(tx.error);
  });
}

async function getSaveHandle() {
  if (SAVE.handle !== undefined) return SAVE.handle;
  try {
    const rec = await handleStore('readonly', st => st.get('__savehandle'));
    SAVE.handle = (rec && rec.handle) || null;
  } catch (e) { SAVE.handle = null; }
  return SAVE.handle;
}

async function pickSaveFile() {
  if (!window.showSaveFilePicker) return null;
  const handle = await window.showSaveFilePicker({
    suggestedName: 'livery-work.json',
    types: [{ description: 'Arbeitsstand', accept: { 'application/json': ['.json'] } }]
  });
  SAVE.handle = handle;
  try { await handleStore('readwrite', st => st.put({ id: '__savehandle', handle })); } catch (e) {}
  return handle;
}

async function serverAlive() {
  try {
    const r = await fetch(`http://127.0.0.1:${SAVE.port}/ping`, { cache: 'no-store' });
    return r.ok;
  } catch (e) { return false; }
}

function markSaved(where) {
  S.work.savedRev = S.work.rev || 0;
  S.work.savedAt = new Date().toISOString().slice(0, 16).replace('T', ' ') + ' · ' + where;
  try { localStorage.setItem(WORK_KEY, JSON.stringify(S.work)); } catch (e) {}
  render();
}

/** Ein Klick, kein Pfad, kein Download-Ordner. */
async function saveWorkFile(silent) {
  const json = JSON.stringify(S.work, null, 2);

  const handle = await getSaveHandle();
  if (handle) {
    try {
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted' || await handle.requestPermission({ mode: 'readwrite' }) === 'granted') {
        const w = await handle.createWritable();
        await w.write(json);
        await w.close();
        markSaved('Datei');
        if (!silent) toast('Gespeichert in ' + handle.name);
        return true;
      }
    } catch (e) { /* Handle tot – unten weiter */ }
  }

  if (await serverAlive()) {
    try {
      const r = await fetch(`http://127.0.0.1:${SAVE.port}/save/work`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: json
      });
      const out = await r.json();
      if (!r.ok) throw new Error(out.error || ('HTTP ' + r.status));
      markSaved('Projekt');
      if (!silent) toast('Gespeichert: ' + out.file);
      return true;
    } catch (e) {
      alert('Der Speicher-Dienst antwortet, aber das Schreiben schlug fehl:\n' + e.message);
      return false;
    }
  }

  if (window.showSaveFilePicker) {
    if (!confirm('Noch keine Zieldatei festgelegt.\n\n' +
        'Jetzt einmalig tools/quellen/livery-work.json auswählen? ' +
        'Danach speichert der Knopf ohne Nachfrage dorthin.')) return false;
    try {
      await pickSaveFile();
      return saveWorkFile(silent);
    } catch (e) { return false; }
  }

  if (!confirm('Ohne Speicher-Dienst kann dieser Browser nicht direkt ins Projekt schreiben.\n\n' +
      'Starte in einem zweiten Fenster:  node tools/livery-server.js\n\n' +
      'Stattdessen jetzt als Download ablegen?')) return false;
  download('livery-work.json', json);
  markSaved('Download');
  return true;
}

function toast(text) {
  let el = $('#toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('on'), 2600);
}

function importWork() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = () => {
    const r = new FileReader();
    r.onload = () => {
      try {
        const w = JSON.parse(r.result);
        if (!w.cells) throw new Error('Keine cells im Arbeitsstand');
        if (!confirm('Ersetzt den lokalen Arbeitsstand (' + Object.keys(S.work.cells).length +
                     ' Zellen) durch ' + Object.keys(w.cells).length + ' Zellen. Weiter?')) return;
        S.work = Object.assign({ cells: {}, imports: [], images: {}, teamNotes: {}, yearImages: {}, yearRefs: {} }, w);
        saveWork(); dlg.close(); render();
      } catch (e) { alert('Fehler: ' + e.message); }
    };
    r.readAsText(inp.files[0]);
  };
  inp.click();
}

function download(name, text) {
  const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ======================================================================
   Bildersammlung – bleibt erhalten, aus jedem Team-Jahr erreichbar

   Blobs gehören in IndexedDB: localStorage kann nur Strings und wäre nach
   drei Fotos voll. Ein Bild, das mehrere Jahre oder mehrere Wagen zeigt,
   sammelt man einmal ein und pipettiert daraus für viele Zellen.
   ====================================================================== */
const LIB = { items: [], urls: {} };

function idb() {
  return new Promise((res, rej) => {
    const rq = indexedDB.open('f1rpg-livery-images', 1);
    rq.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('images')) db.createObjectStore('images', { keyPath: 'id' });
    };
    rq.onsuccess = e => res(e.target.result);
    rq.onerror = () => rej(rq.error || new Error('IndexedDB nicht verfügbar'));
  });
}

async function libTx(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction('images', mode);
    const out = fn(tx.objectStore('images'));
    tx.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
    tx.onerror = () => rej(tx.error);
  });
}

async function libLoad() {
  try {
    LIB.items = await libTx('readonly', st => st.getAll());
    LIB.items.sort((a, b) => (b.addedAt || '').localeCompare(a.addedAt || ''));
  } catch (e) {
    LIB.items = [];
    console.warn('Bildersammlung nicht lesbar:', e.message);
  }
}

async function libAdd(files) {
  const list = [...(files || [])].filter(f => /^image\//.test(f.type));
  if (!list.length) return 0;
  for (const f of list) {
    const rec = {
      id: 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      name: f.name || 'Bild', type: f.type, size: f.size,
      blob: f, note: '', addedAt: new Date().toISOString()
    };
    await libTx('readwrite', st => st.put(rec));
  }
  await libLoad();
  if (!$('#tray').hidden) renderTray();
  return list.length;
}

async function libDelete(id) {
  await libTx('readwrite', st => st.delete(id));
  if (LIB.urls[id]) { URL.revokeObjectURL(LIB.urls[id]); delete LIB.urls[id]; }
  await libLoad();
  if (!$('#tray').hidden) renderTray();
}

async function libRename(id, name, note) {
  const rec = LIB.items.find(x => x.id === id);
  if (!rec) return;
  rec.name = name; rec.note = note;
  await libTx('readwrite', st => st.put(rec));
  await libLoad();
}

function libUrl(rec) {
  if (!LIB.urls[rec.id]) LIB.urls[rec.id] = URL.createObjectURL(rec.blob);
  return LIB.urls[rec.id];
}

const fmtKB = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB';

/* ---- Bildleiste: der umgekehrte Weg – Team-Jahr auf ein Bild ziehen ---- */

async function toggleTray(force) {
  const tray = $('#tray');
  const show = force !== undefined ? force : tray.hidden;
  tray.hidden = !show;
  if (show) { await libLoad(); renderTray(); }
  sizeTray();
}

function sizeTray() {
  const tray = $('#tray');
  document.documentElement.style.setProperty('--tray',
    tray.hidden ? '0px' : tray.offsetHeight + 'px');
}

function renderTray() {
  const strip = $('#trayStrip');
  if (!LIB.items.length) {
    strip.innerHTML = '<span class="hint">Noch keine Bilder. Zieh welche in die Werkstatt oder ' +
      'sammle sie über „verwalten".</span>';
    return;
  }
  strip.innerHTML = LIB.items.map(r =>
    `<div class="traythumb" data-tray="${r.id}" title="${esc(r.name)}${r.note ? ' – ' + esc(r.note) : ''}">
       <img src="${libUrl(r)}" alt=""><span>${esc(r.note || r.name)}</span>
     </div>`).join('');

  strip.querySelectorAll('[data-tray]').forEach(el => {
    const rec = () => LIB.items.find(x => x.id === el.dataset.tray);
    // Klick: Bild mit der gerade gewählten Zelle öffnen
    el.onclick = () => {
      if (!S.ui.sel) return alert('Erst ein Team-Jahr anklicken – oder eines auf das Bild ziehen.');
      const r = rec(); if (r) openPicker(S.ui.sel, null, [r]);
    };
    // Ziehen: das Team-Jahr kommt zum Bild statt umgekehrt
    el.addEventListener('dragover', e => {
      if (!e.dataTransfer.types.includes('text/f1cell')) return;
      e.preventDefault(); el.classList.add('dropok');
    });
    el.addEventListener('dragleave', () => el.classList.remove('dropok'));
    el.addEventListener('drop', e => {
      el.classList.remove('dropok');
      const key = e.dataTransfer.getData('text/f1cell');
      if (!key) return;
      e.preventDefault();
      const r = rec(); if (r) openPicker(key, null, [r]);
    });
  });
}

async function showLibrary() {
  await libLoad();
  const total = LIB.items.reduce((n, r) => n + (r.size || 0), 0);

  openDialog('Bildersammlung', `
    <div id="libDrop" class="drop">Bilder hierher ziehen, einfügen (Strg+V) oder
      <label class="linkish">auswählen<input type="file" id="libFile" accept="image/*" multiple hidden></label>
    </div>
    <div class="hint" style="margin:8px 0">${LIB.items.length} Bilder · ${fmtKB(total)} ·
      bleiben in diesem Browser gespeichert, auch nach dem Schließen.
      Ein Bild mit mehreren Jahren oder Wagen sammelst du einmal ein und nutzt es für viele Zellen.</div>
    <div id="libGrid" class="libgrid"></div>`,
    [], true);

  const drop = $('#libDrop');
  ['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove('over')));
  drop.addEventListener('drop', async e => {
    e.preventDefault();
    const n = await libAdd(e.dataTransfer.files);
    if (n) showLibrary();
  });
  $('#libFile').onchange = async e => { if (await libAdd(e.target.files)) showLibrary(); };

  renderLibGrid();
}

function renderLibGrid() {
  const grid = $('#libGrid');
  if (!grid) return;
  grid.innerHTML = LIB.items.map(r => `
    <div class="libcard" data-id="${r.id}">
      <img src="${libUrl(r)}" alt="${esc(r.name)}" loading="lazy">
      <div class="libmeta">
        <input class="libname" value="${esc(r.name)}" data-name="${r.id}">
        <input class="libnote" value="${esc(r.note || '')}" placeholder="Notiz, z. B. „1974–77, alle Wagen"" data-note="${r.id}">
        <div class="libacts">
          <span class="hint">${fmtKB(r.size || 0)}</span>
          <span class="grow"></span>
          <button data-use="${r.id}">Pipette</button>
          <button data-del="${r.id}">löschen</button>
        </div>
      </div>
    </div>`).join('') || '<div class="hint">Noch keine Bilder gesammelt.</div>';

  grid.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const rec = LIB.items.find(x => x.id === b.dataset.del);
    if (!confirm('„' + (rec ? rec.name : '') + '" endgültig aus der Sammlung löschen?')) return;
    await libDelete(b.dataset.del);
    showLibrary();
  });
  grid.querySelectorAll('[data-use]').forEach(b => b.onclick = () => {
    const rec = LIB.items.find(x => x.id === b.dataset.use);
    if (!rec) return;
    if (!S.ui.sel) return alert('Erst ein Team-Jahr anklicken – die Farbe muss ja irgendwo hin.');
    dlg.close();
    openPicker(S.ui.sel, null, [rec]);
  });
  const save = el => libRename(el.dataset.name || el.dataset.note,
    $(`[data-name="${el.dataset.name || el.dataset.note}"]`).value,
    $(`[data-note="${el.dataset.name || el.dataset.note}"]`).value);
  grid.querySelectorAll('.libname,.libnote').forEach(el => el.onchange = () => save(el));
}

      <div class="pkside">
        <canvas id="pkLoupe" width="120" height="120"></canvas>
        <div id="pkHover" class="mono hint">Zeiger über das Bild</div>
      </div>
    </div>
    <div class="hint" style="margin-top:10px">Klick ins Bild nimmt eine Farbe ab –
      bis zu drei, sie sammeln sich unten im Fuß. Fenster an der rechten unteren
      Ecke größer ziehen.</div>`,
    [{ label: 'Übernehmen', primary: true, fn: applyPicked }], true);

  const drop = $('#pkDrop');
  ['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.add('over');
  }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove('over')));
  drop.addEventListener('drop', e => { e.preventDefault(); addImages(e.dataTransfer.files); });
  $('#pkFile').onchange = e => addImages(e.target.files);
  const refBtn = $('#pkRef');
  if (refBtn) refBtn.onclick = () => addImageUrl(S.work.images[team]);

  renderPicked();
  libLoad().then(renderPickerLib);
  if (files && files.length) addImages(files);
  if (fromLib && fromLib.length) fromLib.forEach(rec => addFromLib(rec));
}

/** Miniaturen der gespeicherten Sammlung im Farbeditor. */
function renderPickerLib() {
  const box = $('#pkLib');
  if (!box) return;
  if (!LIB.items.length) {
    box.innerHTML = '<span class="hint">Noch nichts gesammelt – Bilder hier hineinziehen landen automatisch in der Sammlung.</span>';
    return;
  }
  box.innerHTML = LIB.items.map(r =>
    `<img class="libthumb" src="${libUrl(r)}" title="${esc(r.name)}${r.note ? ' – ' + esc(r.note) : ''}" data-lib="${r.id}">`).join('');
  box.querySelectorAll('[data-lib]').forEach(el => el.onclick = () => {
    const rec = LIB.items.find(x => x.id === el.dataset.lib);
    if (rec) addFromLib(rec);
  });
}

function addFromLib(rec) {
  const img = new Image();
  img.onload = () => { PICK.images.push({ img, name: rec.name }); showImage(PICK.images.length - 1); };
  img.src = libUrl(rec);
}

function addImages(fileList) {
  const files = [...(fileList || [])].filter(f => /^image\//.test(f.type));
  if (!files.length) return;
  // Was einmal hereingezogen wurde, bleibt gesammelt – sonst muesste man
  // dasselbe Bild fuer jedes Team-Jahr neu suchen.
  libAdd(files).then(() => renderPickerLib()).catch(() => {});
  let pending = files.length;
  files.forEach(f => {
    const img = new Image();
    img.onload = () => { PICK.images.push({ img, name: f.name }); if (!--pending) showImage(PICK.images.length - 1); };
    img.onerror = () => { if (!--pending) renderThumbs(); };
    img.src = URL.createObjectURL(f);
  });
}

/** Externe Bilder gehen nur, wenn die fremde Seite CORS erlaubt. */
function addImageUrl(url) {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => { PICK.images.push({ img, name: 'Referenzbild' }); showImage(PICK.images.length - 1); };
  img.onerror = () => alert('Das Bild ließ sich nicht zum Auslesen laden.\n' +
    'Fremde Seiten (pinimg, Instagram) erlauben das meist nicht – ' +
    'lade es herunter und zieh es hier hinein.');
  img.src = url;
}

function renderThumbs() {
  const box = $('#pkLoaded');
  if (box) box.hidden = !PICK.images.length;
  $('#pkThumbs').innerHTML = PICK.images.map((it, i) =>
    `<canvas class="thumb ${i === PICK.active ? 'on' : ''}" data-img="${i}" width="64" height="44"></canvas>`).join('');
  PICK.images.forEach((it, i) => {
    const c = $('#pkThumbs').querySelector(`[data-img="${i}"]`);
    const ctx = c.getContext('2d');
    const s = Math.min(64 / it.img.width, 44 / it.img.height);
    ctx.drawImage(it.img, (64 - it.img.width * s) / 2, (44 - it.img.height * s) / 2,
                  it.img.width * s, it.img.height * s);
    c.onclick = () => showImage(i);
  });
}

function showImage(i) {
  PICK.active = i;
  renderThumbs();
  const it = PICK.images[i];
  if (!it) return;
  const stage = $('#pkStage');
  stage.hidden = false;

  const cv = $('#pkCanvas');
  const maxW = 620, scale = Math.min(1, maxW / it.img.width);
  cv.width = Math.round(it.img.width * scale);
  cv.height = Math.round(it.img.height * scale);
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(it.img, 0, 0, cv.width, cv.height);

  cv.onmousemove = e => {
    const p = canvasPos(cv, e);
    const hex = sampleAt(ctx, p.x, p.y);
    drawLoupe(ctx, p.x, p.y);
    $('#pkHover').innerHTML = hex
      ? `<span class="sw" style="display:inline-block;background:${hex};vertical-align:-2px"></span> ${hex}`
      : 'außerhalb';
  };
  cv.onclick = e => {
    const p = canvasPos(cv, e);
    const hex = sampleAt(ctx, p.x, p.y);
    if (!hex) return;
    if (PICK.picked.length >= 3) return alert('Drei Farben sind das Maximum – erst eine entfernen.');
    PICK.picked.push(hex);
    renderPicked();
    updatePickTitle();
  };
}

function canvasPos(cv, e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.round((e.clientX - r.left) * (cv.width / r.width)),
    y: Math.round((e.clientY - r.top) * (cv.height / r.height))
  };
}

/** 5×5-Mittel statt Einzelpixel – JPEG-Rauschen trifft sonst daneben. */
function sampleAt(ctx, x, y) {
  try {
    const d = ctx.getImageData(Math.max(0, x - 2), Math.max(0, y - 2), 5, 5).data;
    let r = 0, g = 0, b = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i + 3] < 128) continue;
      r += d[i]; g += d[i + 1]; b += d[i + 2]; n++;
    }
    if (!n) return null;
    const h = v => Math.round(v / n).toString(16).padStart(2, '0');
    return ('#' + h(r) + h(g) + h(b)).toUpperCase();
  } catch (err) {
    $('#pkHover').innerHTML = '<span class="bad">Bild von fremder Seite – Auslesen gesperrt (CORS). ' +
      'Herunterladen und hineinziehen.</span>';
    return null;
  }
}

function drawLoupe(srcCtx, x, y) {
  const lp = $('#pkLoupe'), z = 10, span = 12;
  const g = lp.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, lp.width, lp.height);
  try {
    g.drawImage(srcCtx.canvas, x - span / 2, y - span / 2, span, span, 0, 0, lp.width, lp.height);
  } catch (e) { return; }
  g.strokeStyle = '#fff'; g.lineWidth = 1;
  g.strokeRect(lp.width / 2 - z / 2, lp.height / 2 - z / 2, z, z);
  g.strokeStyle = '#000';
  g.strokeRect(lp.width / 2 - z / 2 - 1, lp.height / 2 - z / 2 - 1, z + 2, z + 2);
}

function updatePickTitle() {
  const el = $('#dlgTitle');
  if (el && PICK.key) {
    const [team, year] = PICK.key.split(':');
    const t = S.teams[team] || { name: team };
    el.textContent = `Farbe aus Bild – ${t.name} ${year}  (${PICK.picked.length}/3 abgenommen)`;
  }
}

function renderPicked() {
  const foot = $('#dlgFootLeft');
  if (foot && !$('#pkPicked')) {
    foot.innerHTML = '<div id="pkPicked" class="picked-row"></div>' +
                     '<div id="pkPreview" class="pkpreview"></div>';
  }
  if (!$('#pkPicked')) return;
  $('#pkPicked').innerHTML = PICK.picked.map((c, i) =>
    `<span class="pk" style="background:${c}">
       <b class="mono">${c}</b>
       <button data-dup="${i}" title="verdoppeln – zwei gleiche = ⅔ Anteil">×2</button>
       <button data-rm="${i}" title="entfernen">✕</button>
     </span>`).join('') || '<span class="hint">Noch nichts abgenommen. Ins Bild klicken.</span>';

  $('#pkPreview').innerHTML = PICK.picked.length
    ? `<div style="height:22px;border-radius:5px;background:${gradient(PICK.picked)}"></div>
       <div class="mono hint" style="margin-top:3px">${PICK.picked.join(' ')} · Schrift wäre
         <span style="color:${PICK.picked[0]}">${PICK.picked[0]}</span></div>` : '';

  $('#pkPicked').querySelectorAll('[data-rm]').forEach(b =>
    b.onclick = () => { PICK.picked.splice(+b.dataset.rm, 1); renderPicked(); });
  $('#pkPicked').querySelectorAll('[data-dup]').forEach(b =>
    b.onclick = () => {
      if (PICK.picked.length >= 3) return alert('Drei Farben sind das Maximum.');
      PICK.picked.splice(+b.dataset.dup, 0, PICK.picked[+b.dataset.dup]);
      renderPicked();
    });
}

function applyPicked() {
  if (!PICK.picked.length) return alert('Noch keine Farbe abgenommen.');
  S.ui.sel = PICK.key;
  dlg.close();
  render();
  const nc = $('#nc');
  if (nc) { nc.value = PICK.picked.join('-'); nc.focus(); }
}

/* ======================================================================
   Dialog + Verdrahtung
   ====================================================================== */
function openDialog(title, body, actions, wide) {
  $('#dlgTitle').textContent = title;
  $('#dlgBody').innerHTML = body;
  $('#dlgFoot').innerHTML = '<div id="dlgFootLeft" class="grow"></div>';
  (actions || []).forEach(a => {
    const b = document.createElement('button');
    b.textContent = a.label;
    if (a.primary) b.className = 'on';
    b.onclick = a.fn;
    $('#dlgFoot').appendChild(b);
  });
  dlg.classList.toggle('wide', !!wide);
  dlg.showModal();
}

function buildYearList() {
  const sel = $('#year');
  sel.innerHTML = '';
  for (let y = S.meta.yearTo; y >= S.meta.yearFrom; y--) {
    const o = document.createElement('option');
    o.value = y; o.textContent = y;
    sel.appendChild(o);
  }
  S.ui.year = S.meta.yearTo;
  sel.value = S.ui.year;
}

function wire() {
  $('#vTeam').onclick = () => { S.ui.view = 'team'; $('#vTeam').classList.add('on'); $('#vYear').classList.remove('on'); $('#yearWrap').style.display = 'none'; render(); };
  $('#vYear').onclick = () => { S.ui.view = 'year'; $('#vYear').classList.add('on'); $('#vTeam').classList.remove('on'); $('#yearWrap').style.display = ''; render(); };
  $('#year').onchange = e => { S.ui.year = +e.target.value; render(); };
  $('#q').oninput = e => { S.ui.q = e.target.value; render(); };
  $('#fIndy').onchange = e => { S.ui.indy = e.target.checked; render(); };
  $('#filter').onchange = e => { S.ui.filter = e.target.value; render(); };
  $('#btnFind').onclick = showFindings;
  $('#btnSave').onclick = () => saveWorkFile();
  $('#btnLib').onclick = () => toggleTray();
  addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveWorkFile(); }
  });
  $('#trayClose').onclick = () => toggleTray(false);
  $('#trayManage').onclick = showLibrary;
  $('#btnImport').onclick = showImport;
  $('#btnExport').onclick = showExport;

  $('#view').addEventListener('dragstart', e => {
    const cell = e.target.closest('[data-key]');
    if (!cell) return;
    e.dataTransfer.setData('text/f1cell', cell.dataset.key);
    e.dataTransfer.effectAllowed = 'copy';
    if ($('#tray').hidden) toggleTray(true);
    const [t, y] = cell.dataset.key.split(':');
    $('#trayHint').textContent = `${(S.teams[t] || {}).name || t} ${y} – auf ein Bild fallen lassen`;
  });

  $('#view').addEventListener('click', e => {
    const cell = e.target.closest('[data-key]');
    if (cell) { S.ui.sel = cell.dataset.key; render(); return; }
    const name = e.target.closest('[data-team]');
    if (name) {
      const t = S.teams[name.dataset.team];
      S.ui.sel = t.id + ':' + t.years[0];
      render();
    }
  });

  $('#side').addEventListener('click', e => {
    const key = S.ui.sel; if (!key) return;
    const w = cellWork(key); if (!w) return;
    const pick = e.target.dataset.pick, stage = e.target.dataset.stage,
          un = e.target.dataset.unstage, del = e.target.dataset.del;
    if (pick) { w.pick = pick; }
    else if (stage) { const c = w.candidates.find(x => x.id === stage); c.stage = 'bestaetigt'; w.pick = c.id; }
    else if (un) { w.candidates.find(x => x.id === un).stage = 'vorschlag'; }
    else if (del) {
      w.candidates = w.candidates.filter(x => x.id !== del);
      if (w.pick === del) w.pick = w.candidates.length ? w.candidates[0].id : null;
      if (!w.candidates.length) delete S.work.cells[key];
    } else return;
    saveWork(); render();
  });
}

boot();
</script>
