<!doctype html>
<meta charset="utf-8">
<title>F1 RPG Foto-Vermessung</title>
<body style="font-family:system-ui;background:#161616;color:#eee;padding:20px">
<h3>Misst die echten Bildmasse der Feeder-Fotos</h3>
<p style="color:#999;font-size:13px">Der eigene JPEG-Parser griff bei einigen Dateien daneben
(vermutlich das EXIF-Vorschaubild). Der Browser liefert die wahren Masse.
Ergebnis in <code>window.__masse</code>.</p>
<div id="log" style="font-size:12px;color:#aaa"></div>
<script>
window.__masse = {};
window.__done = false;
(async () => {
    const man = await (await fetch('../assets-backup/manifest.json')).json();
    const files = (man.feederPhotos || []).filter(r => r.file);
    const log = document.getElementById('log');
    for (let i = 0; i < files.length; i++) {
        const r = files[i];
        await new Promise(res => {
            const im = new Image();
            im.onload = () => { window.__masse[r.file] = { n: r.name, w: im.naturalWidth, h: im.naturalHeight }; res(); };
            im.onerror = () => res();
            im.src = '../assets-backup/feeder-photos/' + r.file;
        });
        if (i % 20 === 0) log.textContent = (i + 1) + '/' + files.length;
    }
    window.__done = true;
    log.textContent = 'fertig: ' + Object.keys(window.__masse).length;
})();
</script>
</body>
